# SPDX-License-Identifier: AGPL-3.0-only
#
# The add-on monorepo's CI.
#
# WHY THIS EXISTS. This repo had no `.github` directory at all. Five packages
# and roughly nine hundred tests were verified only on whichever laptop last ran
# `npm run verify` — in a repo whose whole purpose is to be COPIED into two host
# apps, which is the one shape where "it passed locally" is worth least, because
# the copy that ships is somewhere else.
#
# WHY IT CHECKS OUT THE TWO HOSTS. `packages/host/src/host-mirror.test.ts` is
# the guard that holds `testing/egress.ts`, `testing/purity.ts`,
# `testing/encoding.ts`, `add-ons/slotContent.ts`, the seam and the payloads
# byte-for-byte identical across three repos. Every block in it is
# `describe.each(present)`, and `present` means the hosts it can FIND. With no
# checkout beside it there is nothing to compare, so the guard written to catch
# drift becomes the thing that drifts. Ninety assertions turn into none.
#
# It needs their SOURCES and nothing else — the guard reads files, it never runs
# them — so neither host is installed or built here. That is also why this stays
# fast.
#
# `ADMINIUM_REQUIRE_HOSTS` turns a missing checkout into a FAILURE rather than a
# quiet pass. Without it a broken checkout step looks exactly like a clean clone,
# and a clean clone is green by design (somebody reading one add-on is not
# required to clone two host apps).
#
# THE CHECKOUTS SIT BESIDE `packages/` ON PURPOSE, and that was measured, not
# assumed: `npm run test --workspaces` runs vitest once per package with that
# package as its root, so a directory at the repo root is never collected. A
# deliberately failing `.hosts-probe/src/planted.test.ts` was invisible to the
# entire suite. The example apps' workflow has to move its checkout to
# RUNNER_TEMP for the opposite reason — those repos run one vitest from the repo
# root, and on the first attempt it swallowed the product's own test suite.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` needs the committed lockfile. If this repo ever loses it the
      # failure should be loud here rather than a silent `npm install` resolving
      # something different from what the hosts vendor.
      - name: Install dependencies
        run: npm ci

      # Sources only. The drift guard reads these two trees; it does not build
      # or execute them, so there is no install step for either.
      - name: Check out the print works
        uses: actions/checkout@v4
        with:
          repository: Adminiumjs/print-shop
          path: .hosts/print-shop

      - name: Check out the maker studio
        uses: actions/checkout@v4
        with:
          repository: Adminiumjs/maker-shop
          path: .hosts/maker-shop

      # WHY TWO MORE, AND WHY THEY ARE A DIFFERENT KIND OF CHECKOUT.
      #
      # The two above are ADD-ON HOSTS: they mount slots, they vendor the shared
      # mirror, and `host-mirror.test.ts` compares their files byte for byte.
      # These two are ADD-ON TARGETS: `holiday-calendars` attaches to `hr` and
      # `clinic`, and `manifest-schema.test.ts` runs the product's own validator
      # against each app's declared tables — so a scope naming a table
      # people-ops has not got is refused here rather than by an installer.
      #
      # Neither has an `src/add-ons/` directory yet, so neither is judged by the
      # attach-surface gate; that suite names them instead of skipping quietly.
      # Without these two steps the manifest's attach claim is UNVERIFIABLE in
      # CI, and the gate that reports an unverifiable claim would fail — which is
      # the correct behaviour and the reason these lines exist rather than a
      # loosened assertion.
      - name: Check out the people-ops app
        uses: actions/checkout@v4
        with:
          repository: Adminiumjs/people-ops
          path: .hosts/people-ops

      - name: Check out the clinic-desk app
        uses: actions/checkout@v4
        with:
          repository: Adminiumjs/clinic-desk
          path: .hosts/clinic-desk

      # ── AND THE TWO CARRIER HOSTS, WHICH ARRIVED AFTER THE BLOCK ABOVE ──────
      #
      # [Added 2026-08-28, wave 6, and the omission is the lesson.] The four
      # names above were added when `holiday-calendars` attached to two apps.
      # The SAME DAY, the carrier retrofits made `factory-ops` and
      # `ecommerce-storefront` real add-on hosts and registered them in
      # `manifest-schema.test.ts`'s `HOST_ROOTS` — and nobody came back here.
      #
      # The consequence is exactly the one this file's own comment above warns
      # about, arrived at from the other direction: `shipping-dhl` now attaches
      # to `factory` and `ecommerce-shop`, and with neither app checked out
      # those two claims are UNVERIFIABLE in CI while passing perfectly on the
      # laptop of anybody who has the whole fleet cloned beside them. A guard
      # that only runs on one machine is the disease this repo's CI exists to
      # treat.
      #
      # Unlike the two apps above, these two DO have `src/add-ons/`, so they are
      # judged by the attach-surface gate as well as by the validator — which is
      # the stricter of the two readings and the reason they belong here rather
      # than in an env-var-only exemption.
      - name: Check out the factory-ops app
        uses: actions/checkout@v4
        with:
          repository: Adminiumjs/factory-ops
          path: .hosts/factory-ops

      - name: Check out the ecommerce-storefront app
        uses: actions/checkout@v4
        with:
          repository: Adminiumjs/ecommerce-storefront
          path: .hosts/ecommerce-storefront

      # `verify` is the repo's own script — typecheck, then test, then build —
      # so CI cannot drift from what a maintainer runs by hand.
      - name: Typecheck, test, build
        env:
          ADMINIUM_PRINT_SHOP: ${{ github.workspace }}/.hosts/print-shop
          ADMINIUM_MAKER_SHOP: ${{ github.workspace }}/.hosts/maker-shop
          ADMINIUM_PEOPLE_OPS: ${{ github.workspace }}/.hosts/people-ops
          ADMINIUM_CLINIC_DESK: ${{ github.workspace }}/.hosts/clinic-desk
          ADMINIUM_FACTORY_OPS: ${{ github.workspace }}/.hosts/factory-ops
          ADMINIUM_ECOMMERCE_STOREFRONT: ${{ github.workspace }}/.hosts/ecommerce-storefront
          # Only the two add-on HOSTS are required: `host-mirror.test.ts` is the
          # guard this covers, and it compares vendored files that only those two
          # carry. The two target apps above are read by a different suite, which
          # reports their absence rather than depending on it.
          ADMINIUM_REQUIRE_HOSTS: 'true'
        run: npm run verify
