# SPDX-License-Identifier: AGPL-3.0-only
#
# WHERE A RELEASE GOES (48-self-hosted-downloads.md D1/D6). Each packed add-on
# is uploaded to the Adminiumjs downloads bucket, read back from
# https://downloads.adminium.dev, and only then recorded in RELEASES.json.
# Add-ons are not published to npm.
#
# DISPATCH-TRIGGERED, NOT TAG-TRIGGERED — a deliberate difference from the main
# monorepo's release.yml, forced by the release ledger. It wants
# `{name, version, integrity}` computed from the files that were actually
# released, committed into the repo, and INSIDE the tag. A tag-triggered run
# cannot commit into the tag that started it. So this job uploads, writes the
# ledger, commits it, and cuts the tag last. The guards `on: push: tags` would
# have given for free are restated explicitly in the first step: main only, and
# refuse a tag that already exists.
#
# BEFORE THE FIRST RUN: this repository must be granted the Adminiumjs
# organization's variables R2_ACCOUNT_ID + R2_BUCKET and secrets
# R2_ACCESS_KEY_ID + R2_SECRET_ACCESS_KEY (48 §3 gate 1.7). The secret key is
# an Object Read & Write token scoped to the bucket: it can add a version and
# can never replace or delete one (48 D2).

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (e.g. 1.0.1). Must already be in every package.json AND manifest.json.'
        required: true
        type: string

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # commit the ledger, push the tag
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Refuse anything but main, and any tag that already exists
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a semver version"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists — released files are immutable, pick a new version"; exit 1
          fi
          echo "Releasing $VERSION from $(git rev-parse --short HEAD)"

      # Before anything is built: a repo that was never granted the bucket
      # credentials should find out in seconds, not after a full verify.
      - name: Refuse to start without the bucket credentials
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          HAS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID != '' }}
          HAS_SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY != '' }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$R2_ACCOUNT_ID" ] || missing+=('variable R2_ACCOUNT_ID')
          [ -n "$R2_BUCKET" ] || missing+=('variable R2_BUCKET')
          [ "$HAS_KEY_ID" = true ] || missing+=('secret R2_ACCESS_KEY_ID')
          [ "$HAS_SECRET" = true ] || missing+=('secret R2_SECRET_ACCESS_KEY')
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::not granted to this repository: ${missing[*]} (Adminiumjs organization settings)"; exit 1
          fi

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck, test, build
        run: npm run verify

      # The manifests on disk are what ships: publish-add-ons.mjs reads each
      # package's own version and never looks at this input. Assert they agree
      # with what was asked for BEFORE anything is uploaded — the bucket has no undo.
      # This is also the backstop for a `changeset version` run where
      # sync-manifest-versions.mjs did not happen.
      - name: Assert every package and manifest is at the requested version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          node -e '
            const { readdirSync, readFileSync, existsSync } = require("fs");
            const { join } = require("path");
            const want = process.env.VERSION;
            const bad = [];
            let n = 0;
            for (const d of readdirSync("packages")) {
              const m = join("packages", d, "manifest.json");
              if (!existsSync(m)) continue;
              n += 1;
              const pkg = JSON.parse(readFileSync(join("packages", d, "package.json"), "utf8"));
              const man = JSON.parse(readFileSync(m, "utf8"));
              if (pkg.version !== want) bad.push(`${d}/package.json is ${pkg.version}`);
              if (man.version !== want) bad.push(`${d}/manifest.json is ${man.version}`);
            }
            if (n < 6) { console.error(`::error::only ${n} add-ons discovered under packages/`); process.exit(1); }
            if (bad.length) { console.error(`::error::expected ${want}:\n  ` + bad.join("\n  ")); process.exit(1); }
            console.log(`${n} add-ons all at ${want}`);
          '

      # Pack + X-ray everything before uploading anything. A released version
      # is immutable, so a defect found while packing package five must not
      # leave four in the bucket forever.
      - name: Pack and X-ray every tarball
        run: node scripts/publish-add-ons.mjs --dry-run

      # The only step that sees the bucket credentials. It uploads every file,
      # reads each back from downloads.adminium.dev, and writes the ledger only
      # once all of them are served with their build's sha512. Re-dispatching
      # the same version after a failure here is safe: identical bytes already
      # in the bucket are accepted, different ones are refused.
      - name: Upload, read back, and write the release ledger
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/publish-add-ons.mjs

      # The ledger is what the marketplace catalog carries to every server (48
      # D3). It has to be readable at a pinned SHA, so it is committed and
      # tagged rather than left as a build artifact.
      - name: Commit the ledger and cut the tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name  'Mohamed Sofi'
          git config user.email 'designsuniverse@gmail.com'
          git add RELEASES.json
          if git diff --cached --quiet; then
            echo "::error::RELEASES.json did not change — the upload step wrote no ledger"; exit 1
          fi
          git commit -m "chore(release): ledger for v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin HEAD:main
          git push origin "v$VERSION"

      - name: Summary
        env:
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "### Released \`v$VERSION\`"
            echo
            echo '| add-on | version | download | integrity |'
            echo '|---|---|---|---|'
            node -e '
              const l = JSON.parse(require("fs").readFileSync("RELEASES.json", "utf8"));
              for (const r of l.releases) {
                const url = `https://downloads.adminium.dev/add-ons/${r.key}/${r.key}-${r.version}.tgz`;
                console.log(`| \`${r.key}\` | ${r.version} | ${url} | \`${r.integrity.slice(0, 24)}…\` |`);
              }
            '
          } >> "$GITHUB_STEP_SUMMARY"
