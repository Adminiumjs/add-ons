<!doctype html>
<html lang="en-US" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customiser — the customer's editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=Caveat:wght@500;600;700&family=Zilla+Slab:wght@500;600;700&family=Oswald:wght@400;500;600&family=Archivo:wght@400;500;600;700;800&family=Libre+Baskerville:wght@400;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
    <style>
      /* Each shop's own tokens, as its comp sets them: the editor reads them through the variables. */
      :root {
        --bg: #f6f6f8; --surface: #ffffff; --surface-2: #fafafa; --surface-3: #f1f1f4;
        --border: #ececef; --border-strong: #e2e2e8;
        --fg: #191920; --fg-muted: #4a4a54; --fg-subtle: #5a5a65;
        --pos: #0b7d59; --pos-soft: #e6f5ee; --warn: #a95800; --warn-soft: #fbf0e2;
        --danger: #cf273c; --danger-soft: #fdecec; --info: #1c59e0; --info-soft: #e7edfd;
        --shadow: 0 1px 2px rgba(16,16,24,.04), 0 8px 24px rgba(16,16,24,.06);
        --shadow-lift: 0 2px 4px rgba(16,16,24,.06), 0 16px 38px rgba(16,16,24,.11);
        --mono: 'JetBrains Mono', ui-monospace, monospace;
        --accent: #78350f; --accent-fg: #ffffff; --accent-soft: rgba(120,53,15,.10);
      }
      :root[data-shop="print"] { --accent: #db2777; --accent-fg: #ffffff; --accent-soft: rgba(219,39,119,.10); }
      :root[data-theme="dark"] {
        --bg: #0a0a0d; --surface: #141419; --surface-2: #1a1a20; --surface-3: #24242c;
        --border: rgba(255,255,255,.07); --border-strong: rgba(255,255,255,.13);
        --fg: #f4f4f6; --fg-muted: #b7b7c3; --fg-subtle: #a1a1ad;
        --pos: #3ecf8e; --pos-soft: rgba(62,207,142,.14); --warn: #e0a458; --warn-soft: rgba(224,164,88,.14);
        --danger: #ff6b6b; --danger-soft: rgba(255,107,107,.14); --info: #6ea8ff; --info-soft: rgba(110,168,255,.14);
        --shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.45);
        --shadow-lift: 0 2px 4px rgba(0,0,0,.55), 0 16px 40px rgba(0,0,0,.55);
        --accent: #e0b08a; --accent-fg: #0f0f14; --accent-soft: rgba(224,176,138,.20);
      }
      :root[data-theme="dark"][data-shop="print"] { --accent: #f9a8d4; --accent-fg: #0f0f14; --accent-soft: rgba(249,168,212,.20); }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--fg); font-family: 'Manrope', system-ui, sans-serif; }
      .dev-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 10px 16px; border-block-end: 1px solid var(--border); background: var(--surface-2); font-size: 13px; }
      .dev-bar select, .dev-bar button { border: 1px solid var(--border-strong); background: var(--surface); color: var(--fg); border-radius: 8px; padding: 6px 10px; font: inherit; }
      .dev-frame { max-inline-size: 1180px; margin-inline: auto; padding: 24px 22px 80px; }
      .dev-frame.phone { max-inline-size: 390px; padding: 16px 14px 40px; box-shadow: 0 0 0 1px var(--border-strong); background: var(--bg); min-block-size: 100vh; }
      .dev-out { font-family: var(--mono); font-size: 11px; color: var(--fg-subtle); padding: 6px 16px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
